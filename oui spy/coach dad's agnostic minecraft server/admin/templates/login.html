<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Dad's MC Admin — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0b0f;
            color: #c8c8d0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* subtle grid overlay for HUD feel */
            background-image:
                linear-gradient(rgba(0,255,240,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,240,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .login-box {
            background: #111116;
            border: 1px solid rgba(0,255,240,0.12);
            border-top: 2px solid #00fff0;
            border-radius: 2px;
            padding: 48px;
            width: 420px;
            position: relative;
            box-shadow:
                0 0 30px rgba(0,0,0,0.6),
                0 0 60px rgba(0,255,240,0.04);
        }
        /* corner accent cuts */
        .login-box::before {
            content: '';
            position: absolute;
            top: -2px; right: 0;
            width: 24px; height: 24px;
            border-right: 2px solid #00fff0;
            border-top: 2px solid #00fff0;
        }
        .login-box::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 24px; height: 24px;
            border-left: 2px solid rgba(0,255,240,0.3);
            border-bottom: 2px solid rgba(0,255,240,0.3);
        }

        .login-box h1 {
            text-align: center;
            font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #00fff0;
            text-shadow: 0 0 20px rgba(0,255,240,0.3);
        }

        .login-box p {
            text-align: center;
            color: #555;
            margin-bottom: 36px;
            font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .error {
            background: rgba(255,45,85,0.08);
            border-left: 3px solid #ff2d55;
            color: #ff5c7c;
            padding: 12px 16px;
            border-radius: 0;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: left;
            font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
        }

        label {
            display: block;
            font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-left: 2px solid rgba(0,255,240,0.3);
            border-radius: 0;
            color: #e0e0e8;
            font-size: 15px;
            font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: rgba(0,255,240,0.4);
            border-left-color: #00fff0;
            box-shadow: 0 0 12px rgba(0,255,240,0.1), inset 0 0 12px rgba(0,255,240,0.03);
        }

        button {
            width: 100%;
            padding: 14px;
            background: rgba(0,255,240,0.08);
            border: 1px solid rgba(0,255,240,0.3);
            border-radius: 2px;
            color: #00fff0;
            font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background: rgba(0,255,240,0.15);
            box-shadow: 0 0 20px rgba(0,255,240,0.15), inset 0 0 20px rgba(0,255,240,0.05);
            border-color: #00fff0;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Coach Dad's MC Admin</h1>
        <p>Minecraft Server Control Panel</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" autofocus required>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Enter the Control Room</button>
        </form>
    </div>
</body>
</html>
