# =============================================================================
# Minecraft Server — Universal (Java + Bedrock) with playit.gg Tunnel
# =============================================================================
# PaperMC server with GeyserMC + Floodgate + playit.gg
# ARM-native, perfect for Apple Silicon + OrbStack
#
# Supports ALL players:
#   - Java Edition (Mac, Windows, Linux)  → connect via playit.gg address
#   - Bedrock Edition (iOS, Android, Xbox, PS, Switch, Win10/11)
#                                          → same playit.gg address
#   - LAN players                          → localhost:25565 / :19132
#
# Setup (one-time):
#   1. Sign up at https://playit.gg (free)
#   2. Create an agent, copy your secret key
#   3. Paste it in .env as PLAYIT_SECRET=your-secret-here
#   4. In the playit.gg dashboard, create tunnels:
#      - Minecraft Java  → TCP port 25565
#      - Minecraft Bedrock → UDP port 19132
#   5. docker compose up -d
#   6. Share your playit.gg address with friends — done!
#
# Usage:
#   docker compose up -d              # Start everything
#   docker compose down               # Stop everything
#   docker compose logs -f mc         # Server logs
#   docker compose logs -f tunnel     # Tunnel logs
#   docker compose logs -f admin      # Admin panel logs
#   docker compose exec mc rcon-cli   # RCON console access
#
# Admin Panel: http://localhost:8420
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Minecraft Server — PaperMC + GeyserMC + Floodgate
  # ---------------------------------------------------------------------------
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      # Java Edition (local/LAN access)
      - "${MC_PORT:-25565}:25565"
      # Bedrock Edition (local/LAN access)
      - "${MC_BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      - ./data:/data
    environment:
      EULA: "TRUE"
      # -- PaperMC + GeyserMC + Floodgate --
      # Paper = high-performance fork of Spigot (plugin compatible)
      # GeyserMC = translates Bedrock protocol → Java protocol
      # Floodgate = lets Bedrock players join WITHOUT a Java account
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-LATEST}"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
      # -- Resources --
      MEMORY: "${MC_MEMORY:-4G}"
      MAX_MEMORY: "${MC_MAX_MEMORY:-4G}"
      USE_AIKAR_FLAGS: "true"
      ENABLE_ROLLING_LOGS: "true"
      TZ: "${TZ:-America/New_York}"
      # -- Server identity --
      SERVER_NAME: "${MC_SERVER_NAME:-My Server}"
      MOTD: "${MC_MOTD:-\\u00a7b\\u00a7lMinecraft Server \\u00a77— All platforms welcome!}"
      # -- Gameplay --
      MODE: "${MC_MODE:-survival}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "8"
      PVP: "${MC_PVP:-true}"
      ALLOW_NETHER: "true"
      ENABLE_COMMAND_BLOCK: "true"
      SPAWN_PROTECTION: "0"
      # -- World --
      LEVEL_TYPE: "${MC_LEVEL_TYPE:-DEFAULT}"
      SEED: "${MC_SEED:-}"
      # -- Access control --
      OPS: "${MC_OPS:-}"
      WHITELIST: "${MC_WHITELIST:-}"
      ENABLE_WHITELIST: "${MC_ENABLE_WHITELIST:-false}"
      # Floodgate handles Bedrock auth, so online-mode stays true for Java
      ONLINE_MODE: "${MC_ONLINE_MODE:-true}"
      # Allow Bedrock/Floodgate players to chat without signed profiles
      ENFORCE_SECURE_PROFILE: "false"
      # -- RCON (for console access) --
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:-changeme}"
      RCON_PORT: "25575"
      # -- Performance tuning for Apple Silicon --
      # Aikar flags already set G1GC; these are additional safe opts
      JVM_XX_OPTS: >-
        -XX:+AlwaysPreTouch
        -XX:+DisableExplicitGC
        -XX:+UnlockExperimentalVMOptions
      SNOOPER_ENABLED: "false"
    deploy:
      resources:
        limits:
          memory: ${MC_CONTAINER_MEM_LIMIT:-5G}
        reservations:
          memory: ${MC_CONTAINER_MEM_RESERVE:-4G}
    healthcheck:
      test: mc-health
      start_period: 120s
      interval: 30s
      retries: 6

  # ---------------------------------------------------------------------------
  # Admin Panel — Coach Dad's God-Mode Control Panel
  # ---------------------------------------------------------------------------
  # Flask app with RCON integration. Full cheat codes, troll scripts,
  # live game settings, player management, and raw console.
  # Access at http://localhost:8420
  # ---------------------------------------------------------------------------
  admin:
    build: ./admin
    container_name: mc-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8420}:5000"
    volumes:
      - ./data/logs:/app/mc-logs:ro
      - ./admin/god_memories:/app/god_memories
    environment:
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:-changeme}"
      ADMIN_USER: "${ADMIN_USER:-coach_dad}"
      ADMIN_PASS: "${ADMIN_PASS:-changeme}"
      ADMIN_SECRET_KEY: "${ADMIN_SECRET_KEY:-super-secret-key-change-me}"
      MLX_HOST: "host.docker.internal:8800"
    depends_on:
      mc:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # playit.gg Tunnel — Exposes server to the internet (TCP + UDP)
  # ---------------------------------------------------------------------------
  # Handles both Java (TCP) and Bedrock (UDP) in one tunnel agent.
  # No port forwarding, no exposing your real IP, free stable address.
  # ---------------------------------------------------------------------------
  tunnel:
    image: pepaslabs/playit:latest
    container_name: mc-tunnel
    restart: unless-stopped
    network_mode: host
    environment:
      SECRET_KEY: "${PLAYIT_SECRET}"
    depends_on:
      mc:
        condition: service_healthy
    profiles:
      - internet  # Only starts with: docker compose --profile internet up -d
